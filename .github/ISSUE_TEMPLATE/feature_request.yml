name: Feature request
description: Propose a scoped capability or integration improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: Integration use case
      description: Describe the product and user workflow, not only the desired control.
    validations:
      required: true
  - type: textarea
    id: limitation
    attributes:
      label: Current limitation
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Best project layer
      options:
        - Framework-neutral core
        - React default UI
        - Email profile
        - Deck/slides layer
        - Host application or adapter
        - Unsure
    validations:
      required: true
