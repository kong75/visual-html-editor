name: Bug report
description: Report a reproducible editor or integration problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, customer data, private templates, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Package version or commit
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core/source engine
        - React workspace
        - Email profile
        - Slides/decks
        - Responsive web
        - Packaging or documentation
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include reduced HTML and profile configuration when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node, React, and bundler versions.
    validations:
      required: true
