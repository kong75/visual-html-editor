name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.18.0
          - os: ubuntu-latest
            node: 24.11.1
          - os: windows-latest
            node: 24.11.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test:coverage
      - run: pnpm test:types
      - run: pnpm test:api
      - run: pnpm test:consumers
      - name: Save packed packages for runtime compatibility tests
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24.11.1'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-packages
          path: .artifacts/consumer-tests/tarballs/*.tgz
          include-hidden-files: true
          retention-days: 7

  runtime:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20.19.0, 22.18.0, 24.11.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: runtime-packages
          path: .artifacts/consumer-tests/tarballs
      - run: node scripts/test-runtime-consumer.mjs

  packed-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    env:
      VHE_TEST_REACT_MAJOR: ${{ matrix.react }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:packed:prepare
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-react-${{ matrix.react }}
          path: |
            test-results/
            test-results-*/
            playwright-report/
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      VHE_E2E_ALL_BROWSERS: 1
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.1
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps ${{ matrix.browser }}
      - run: pnpm exec playwright test --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
